openapi: 3.1.0
info:
  title: ELBER MARKET API
  version: 0.1.0
  description: |
    ELBER MARKET is an integrated agricultural trade infrastructure platform.
    This OpenAPI document is the authoritative contract between the backend,
    the mobile application and (in future) the web application.

    The document is versioned. Breaking changes require a new major version
    and a migration plan for consumers.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: Service is alive
  /readyz:
    get:
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: Service is ready to serve traffic
        "503":
          description: Service is not ready
  /api/v1/:
    get:
      summary: API root
      operationId: apiRoot
      responses:
        "200":
          description: API metadata
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT